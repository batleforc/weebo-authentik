apiVersion: v2
name: weebo-authentik
description: Kubernetes operator that manages Authentik resources (groups, users, applications, access policies) as CRDs.
type: application
version: 0.15.0
appVersion: "0.15.0"
# Native `preStop: sleep` and the admission/policy APIs used here.
kubeVersion: ">=1.30.0-0"
home: https://github.com/batleforc/weebo-authentik
sources:
  - https://github.com/batleforc/weebo-authentik
dependencies:
  # Every resource but the CRDs (templates/operator.yaml); its version is
  # the kit's, as in Cargo.toml (`task kit:sync` keeps them in step).
  - name: weebo-operator-lib
    version: 0.10.1
    repository: oci://ghcr.io/batleforc/charts
