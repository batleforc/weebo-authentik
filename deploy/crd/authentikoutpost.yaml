apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: authentikoutposts.authentik.weebo.io
spec:
  group: authentik.weebo.io
  names:
    categories: []
    kind: AuthentikOutpost
    plural: authentikoutposts
    shortNames: []
    singular: authentikoutpost
  scope: Cluster
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for AuthentikOutpostSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Deliberately minimal — nothing in the Terraform module being replaced
              creates a custom outpost, everything attaches to Authentik's embedded
              outpost by default. This CRD exists only to cover the case where a
              proxy provider's `outpostRef` explicitly names one. Cluster-scoped.
            properties:
              config:
                description: |-
                  Passthrough to the Authentik API — deliberately not modeled field by
                  field. `x-kubernetes-preserve-unknown-fields` is required here: a
                  bare `serde_json::Value` schema has no `type`, which a real
                  structural-schema apiserver rejects outright ("must not be empty
                  for specified object fields") — caught by the layer-3 envtest
                  integration test, not by `cargo check`.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              name:
                type: string
              type:
                enum:
                - ldap
                - radius
                - proxy
                type: string
            required:
            - name
            - type
            type: object
          status:
            nullable: true
            properties:
              authentikId:
                description: |-
                  The Authentik-side primary key. Presence means this CR actually
                  owns/created the corresponding Authentik object — set once on
                  first successful create (or seeded by the import tool), never
                  inferred by name-matching. See `.prompt/plan.md`.
                nullable: true
                type: string
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: One of the operator's reason codes — never a hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              instance:
                description: |-
                  The instance this object was resolved to and stays bound to
                  (`AuthentikApplication`, and the `AuthentikAccessPolicy`s through
                  their application): a `spec.instanceRef` by name only never
                  silently moves to another instance created later under that name.
                nullable: true
                properties:
                  kind:
                    description: '`Instance` or `LocalInstance`.'
                    enum:
                    - Instance
                    - LocalInstance
                    type: string
                  name:
                    type: string
                  namespace:
                    description: The local instance's namespace; absent for a cluster-scoped one.
                    nullable: true
                    type: string
                required:
                - kind
                - name
                type: object
              issuerUrl:
                description: |-
                  Set on an oauth2 `AuthentikApplication` only: the issuer written as
                  its `AUTHENTIK_URL` (`spec.provider.oauth2.issuerUrl`, else
                  Authentik's `<instance url>/application/o/<slug>/`).
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              providerId:
                description: |-
                  Set on `AuthentikApplication` only: the pk of the provider its
                  application points at. Kept so that provider is reused, or deleted
                  with the CR, even after the application itself was deleted out of
                  band in Authentik.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: AuthentikOutpost
        type: object
    served: true
    storage: true
    subresources:
      status: {}
