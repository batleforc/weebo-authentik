apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: authentiklocalinstances.authentik.weebo.io
spec:
  group: authentik.weebo.io
  names:
    categories: []
    kind: AuthentikLocalInstance
    plural: authentiklocalinstances
    shortNames: []
    singular: authentiklocalinstance
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for AuthentikLocalInstanceSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Connection to a real Authentik server, owned by a namespace: its token
              is that namespace's, and only the `AuthentikApplication`s of this
              namespace use it unless `sharedWith` says otherwise. What an operator
              limited to one namespace uses. Credentials of the applications bound to
              it are written as Kubernetes `Secret`s only: the operator's Vault
              identity is shared by every namespace, so a namespace's own instance
              can't route to Vault.
            properties:
              sharedWith:
                description: |-
                  Other namespaces (or cluster-scoped objects) allowed to use this
                  instance — and its token. Unset: this namespace only.
                nullable: true
                properties:
                  clusterScoped:
                    description: Cluster-scoped objects may use this instance.
                    type: boolean
                  namespaceSelector:
                    description: |-
                      Namespaces whose labels match this selector may use this instance.
                      An empty selector (`{}`) matches every namespace: the instance —
                      and the token it holds — is then shared with the whole cluster.
                    nullable: true
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                        items:
                          description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector applies to.
                              type: string
                            operator:
                              description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                              items:
                                type: string
                              type: array
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                  namespaces:
                    description: Namespaces whose objects may use this instance.
                    items:
                      type: string
                    type: array
                type: object
              tls:
                default:
                  insecureSkipVerify: false
                description: |-
                  TLS verification for the API connection above; the CA `Secret` lives
                  in this namespace.
                properties:
                  caSecretRef:
                    description: |-
                      Optional custom CA certificate (a PEM bundle under `key`) to verify
                      the instance's TLS with, read from a `Secret` of the instance's own
                      namespace. Added on top of the platform trust store.
                    nullable: true
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  insecureSkipVerify:
                    default: false
                    description: |-
                      Skip certificate verification entirely — insecure, intended only for
                      throwaway/self-signed instances. Prefer `caSecretRef` below.
                    type: boolean
                type: object
              tokenSecretRef:
                description: |-
                  The API token the operator authenticates with, in a `Secret` of this
                  namespace labelled `authentik.weebo.io/instance-token: "true"`. Read
                  on every reconcile: rotating it needs no restart.
                properties:
                  key:
                    type: string
                  name:
                    type: string
                required:
                - key
                - name
                type: object
              url:
                description: |-
                  Base **web** URL of the Authentik instance, e.g.
                  `https://login.example.com` — not the `/api/v3` REST endpoint, which
                  is derived from it.
                type: string
            required:
            - tokenSecretRef
            - url
            type: object
          status:
            nullable: true
            properties:
              authentikId:
                description: |-
                  The Authentik-side primary key. Presence means this CR actually
                  owns/created the corresponding Authentik object — set once on
                  first successful create (or seeded by the import tool), never
                  inferred by name-matching. See `.prompt/plan.md`.
                nullable: true
                type: string
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: One of the operator's reason codes — never a hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              instance:
                description: |-
                  The instance this object was resolved to and stays bound to
                  (`AuthentikApplication`, and the `AuthentikAccessPolicy`s through
                  their application): a `spec.instanceRef` by name only never
                  silently moves to another instance created later under that name.
                nullable: true
                properties:
                  kind:
                    description: '`Instance` or `LocalInstance`.'
                    enum:
                    - Instance
                    - LocalInstance
                    type: string
                  name:
                    type: string
                  namespace:
                    description: The local instance's namespace; absent for a cluster-scoped one.
                    nullable: true
                    type: string
                required:
                - kind
                - name
                type: object
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              providerId:
                description: |-
                  Set on `AuthentikApplication` only: the pk of the provider its
                  application points at. Kept so that provider is reused, or deleted
                  with the CR, even after the application itself was deleted out of
                  band in Authentik.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: AuthentikLocalInstance
        type: object
    served: true
    storage: true
    subresources:
      status: {}
