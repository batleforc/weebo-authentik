apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: authentiknamespacepolicies.authentik.weebo.io
spec:
  group: authentik.weebo.io
  names:
    categories: []
    kind: AuthentikNamespacePolicy
    plural: authentiknamespacepolicies
    shortNames: []
    singular: authentiknamespacepolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for AuthentikNamespacePolicySpec via `CustomResource`
        properties:
          spec:
            description: |-
              Namespace allow-list enforced by the admission webhook (and
              double-checked by reconcilers). Cluster-scoped. Default-deny: a
              `(namespace, kind)` pair is only allowed if some rule across every
              `AuthentikNamespacePolicy` explicitly allows it — see
              `domain::allow_list::evaluate`, which this CRD's rules map directly
              onto.
            properties:
              rules:
                items:
                  properties:
                    allowedKinds:
                      items:
                        enum:
                        - AuthentikApplication
                        - AuthentikAccessPolicy
                        type: string
                      type: array
                    effect:
                      enum:
                      - Allow
                      - Deny
                      type: string
                    namespaces:
                      description: Exact namespace names, `*`, or a prefix glob such as `team-*`.
                      items:
                        type: string
                      type: array
                  required:
                  - allowedKinds
                  - effect
                  - namespaces
                  type: object
                type: array
            required:
            - rules
            type: object
          status:
            nullable: true
            properties:
              authentikId:
                description: |-
                  The Authentik-side primary key. Presence means this CR actually
                  owns/created the corresponding Authentik object — set once on
                  first successful create (or seeded by the import tool), never
                  inferred by name-matching. See `.prompt/plan.md`.
                nullable: true
                type: string
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: One of the operator's reason codes — never a hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              instance:
                description: |-
                  The instance this object was resolved to and stays bound to
                  (`AuthentikApplication`, and the `AuthentikAccessPolicy`s through
                  their application): a `spec.instanceRef` by name only never
                  silently moves to another instance created later under that name.
                nullable: true
                properties:
                  kind:
                    description: '`Instance` or `LocalInstance`.'
                    enum:
                    - Instance
                    - LocalInstance
                    type: string
                  name:
                    type: string
                  namespace:
                    description: The local instance's namespace; absent for a cluster-scoped one.
                    nullable: true
                    type: string
                required:
                - kind
                - name
                type: object
              issuerUrl:
                description: |-
                  Set on an oauth2 `AuthentikApplication` only: the issuer written as
                  its `AUTHENTIK_URL` (`spec.provider.oauth2.issuerUrl`, else
                  Authentik's `<instance url>/application/o/<slug>/`).
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              providerId:
                description: |-
                  Set on `AuthentikApplication` only: the pk of the provider its
                  application points at. Kept so that provider is reused, or deleted
                  with the CR, even after the application itself was deleted out of
                  band in Authentik.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: AuthentikNamespacePolicy
        type: object
    served: true
    storage: true
    subresources:
      status: {}
