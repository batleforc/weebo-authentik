apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: authentikaccesspolicies.authentik.weebo.io
spec:
  group: authentik.weebo.io
  names:
    categories: []
    kind: AuthentikAccessPolicy
    plural: authentikaccesspolicies
    shortNames: []
    singular: authentikaccesspolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for AuthentikAccessPolicySpec via `CustomResource`
        properties:
          spec:
            description: |-
              Mirrors `authentik_policy_binding`. Namespaced.

              `application_ref` is deliberately a bare name with **no namespace
              field** — there is no way to express a cross-namespace reference in
              this schema. The reconciler must resolve it via
              `Api::<AuthentikApplication>::namespaced(policy.metadata.namespace)`,
              never a cluster-wide client. See `.prompt/plan.md`,
              "Confinement au namespace, deux couches".
            properties:
              applicationRef:
                description: Name of an `AuthentikApplication` CR in the same namespace.
                type: string
              groupRef:
                description: |-
                  Group this policy binds, by its **Authentik** name
                  (`AuthentikGroup.spec.name`), not the name of the CR describing it —
                  unlike `applicationRef` above, which *is* a CR name. It is resolved
                  with a `/core/groups/?name=` query against the instance; a miss
                  fails the reconcile with `GroupRefNotFound`.
                type: string
              negate:
                default: false
                type: boolean
              order:
                default: 0
                format: int32
                type: integer
            required:
            - applicationRef
            - groupRef
            type: object
          status:
            nullable: true
            properties:
              authentikId:
                description: |-
                  The Authentik-side primary key. Presence means this CR actually
                  owns/created the corresponding Authentik object — set once on
                  first successful create (or seeded by the import tool), never
                  inferred by name-matching. See `.prompt/plan.md`.
                nullable: true
                type: string
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: One of the operator's reason codes — never a hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              instance:
                description: |-
                  The instance this object was resolved to and stays bound to
                  (`AuthentikApplication`, and the `AuthentikAccessPolicy`s through
                  their application): a `spec.instanceRef` by name only never
                  silently moves to another instance created later under that name.
                nullable: true
                properties:
                  kind:
                    description: '`Instance` or `LocalInstance`.'
                    enum:
                    - Instance
                    - LocalInstance
                    type: string
                  name:
                    type: string
                  namespace:
                    description: The local instance's namespace; absent for a cluster-scoped one.
                    nullable: true
                    type: string
                required:
                - kind
                - name
                type: object
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              providerId:
                description: |-
                  Set on `AuthentikApplication` only: the pk of the provider its
                  application points at. Kept so that provider is reused, or deleted
                  with the CR, even after the application itself was deleted out of
                  band in Authentik.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: AuthentikAccessPolicy
        type: object
    served: true
    storage: true
    subresources:
      status: {}
