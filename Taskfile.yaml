version: "3"

includes:
  authentik: ./.task/authentik.yaml
  tests:
    taskfile: ./.task/test.yaml
    flatten: true
  mise: ./.task/mise.yaml
  # cog.toml, rendered from weebo-operator-kit's template (task kit:cog).
  kit: ./.task/kit.yaml

# `testkit` (dev-dependency of `adapters-inbound`, pulled in by any cargo
# invocation that builds its tests, including `clippy --all-targets`) pulls
# in the `envtest` crate, which needs a Go toolchain (`mise use go`) and a
# real `libclang.so` on LIBCLANG_PATH — see crates/testkit/src/envtest.rs
# for why mise's own `clang` package isn't enough. Defaults below match
# that file's documented setup; override by exporting these yourself
# before running `task` if your setup differs.
env:
  # The exported value, else the Che workspace's libclang when present,
  # else the system's (Fedora; CI on Ubuntu exports its own).
  LIBCLANG_PATH:
    sh: |
      che=/home/user/.local/share/llvm-libclang/22.1.8/lib
      if [ -n "${LIBCLANG_PATH:-}" ]; then echo "$LIBCLANG_PATH"
      elif [ -d "$che" ]; then echo "$che"
      else echo /usr/lib64; fi
  BINDGEN_EXTRA_CLANG_ARGS:
    sh: |
      if [ -n "${BINDGEN_EXTRA_CLANG_ARGS+set}" ]; then echo "$BINDGEN_EXTRA_CLANG_ARGS"
      elif [ -d /usr/lib/gcc/x86_64-linux-gnu/15/include ]; then echo "-I/usr/lib/gcc/x86_64-linux-gnu/15/include -I/usr/include"
      else echo "-I/usr/lib/gcc/x86_64-redhat-linux/16/include -I/usr/include"; fi

tasks:
  init:
    desc: "Init folder"
    cmds:
      - mise upgrade
      - cog install-hook -a -o

  doctor:
    desc: "Sanity-check this machine's local dev setup (mise tools, libclang, git hooks) and print next steps"
    cmds:
      - mise install
      - |
        echo "== weebo-authentik dev environment check =="
        ok=true

        if [ ! -e "$LIBCLANG_PATH" ]; then
          echo "  [FAIL] LIBCLANG_PATH does not point at a real file: $LIBCLANG_PATH"
          echo "         crates/testkit's envtest dependency needs a real libclang.so here"
          echo "         for its bindgen build (mise's own 'clang' package isn't enough) —"
          echo "         see crates/testkit/src/envtest.rs and this Taskfile's env: block."
          ok=false
        else
          echo "  [ok] LIBCLANG_PATH -> $LIBCLANG_PATH"
        fi

        if ! mise exec -- go version >/dev/null 2>&1; then
          echo "  [FAIL] go toolchain not available via mise (needed by envtest's bindgen build)"
          ok=false
        else
          echo "  [ok] $(mise exec -- go version)"
        fi

        if [ -f .git/hooks/pre-commit ] && [ -f .git/hooks/commit-msg ]; then
          echo "  [ok] cocogitto git hooks installed"
        else
          echo "  [warn] cocogitto git hooks not installed — run 'task init' (cog install-hook -a -o)"
        fi

        if [ "$ok" = "false" ]; then
          echo ""
          echo "Some checks failed — fix the above before running 'task lint' / 'task test:integration'."
          exit 1
        fi

        echo ""
        echo "Environment looks good. Next steps:"
        echo "  task lint              # cargo fmt --check + clippy -D warnings"
        echo "  task test              # fast unit + contract tests"
        echo "  task test:integration  # + real envtest-backed controller tests"
        echo "  task docs              # Fumadocs dev server"

  recu:
    desc: "Recuring job like regenerating Swagger spec"
    cmds:
      - mise exec -- cargo run -p crdgen -- --out deploy/crd/
      # Helm's crds/ directory is a plain copy, not a template — kept in
      # sync here so it can't silently drift from the generated source.
      - cp deploy/crd/*.yaml deploy/charts/weebo-authentik/crds/
      # CRD reference pages + form schemas of the docs site, and its operator
      # reference (reason codes and metrics read from crates/, the budget from
      # docs/perf/): weebo-crd-docs (@weebo/operator-docs) reads
      # docs/crd-docs.config.mjs and clears its own previous outputs. Needs
      # docs/node_modules (npm ci --prefix docs).
      - mise exec -- npm run gen:crds --prefix docs --silent

  lint:
    desc: "Linting your project to apply good practice"
    cmds:
      - mise exec -- cargo fmt --check
      - mise exec -- cargo clippy --workspace --all-targets -- -D warnings

  audit:
    desc: "Check dependencies for CVE (cargo-deny + trivy on Cargo.lock, npm audit on the docs site)"
    cmds:
      # advisories (RUSTSEC, yanked, unmaintained), licenses and sources —
      # see deny.toml.
      - mise exec -- cargo deny check
      # Lockfile CVEs from trivy's own DB, as a second opinion on cargo-deny.
      - mise exec -- trivy fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL Cargo.lock
      # The docs site's shipped dependencies (dev tooling never reaches the
      # built site).
      - mise exec -- npm audit --prefix docs --omit=dev --audit-level=high

  lint:helm:
    desc: "Lint and smoke-render the operator's Helm chart"
    cmds:
      - mise exec -- helm lint deploy/charts/weebo-authentik
      # certManager.issuerRef.name is `required` in templates/certificate.yaml
      # (no real default makes sense — see values.yaml) — a smoke render
      # needs a stand-in value, this doesn't need to be a real Issuer.
      - mise exec -- helm template deploy/charts/weebo-authentik --set certManager.issuerRef.name=smoke-test-issuer > /dev/null

  docs:
    desc: "Run the Fumadocs documentation site in dev mode"
    dir: docs
    cmds:
      - npm run dev
