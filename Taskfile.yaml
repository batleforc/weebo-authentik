version: "3"

includes:
  authentik: ./.tasks/authentik.yaml
  tests:
    taskfile: ./.tasks/test.yaml
    flatten: true
  mise: ./.tasks/mise.yaml
  # cog.toml, rendered from weebo-operator-kit's template (task kit:cog).
  kit: ./.tasks/kit.yaml
  # weebo-operator-kit's shared tasks, pinned to the kit tag of Cargo.toml
  # and to their sha256: `task kit:sync` rewrites both. `task --offline`
  # runs from Task's cache.
  rust:
    taskfile: https://raw.githubusercontent.com/batleforc/weebo-operator-kit/v0.10.1/tasks/rust.yaml
    checksum: 75360142235715643265ae41de1f531dda6562a2472e8d9af21ad65f7d753d63
  repo:
    taskfile: https://raw.githubusercontent.com/batleforc/weebo-operator-kit/v0.10.1/tasks/repo.yaml
    checksum: 162d15bf9c41f494efcb6d73e089ac685d23bc98269a41daf62db26534f52f72
    vars:
      CONTAINERFILES: Dockerfile
      NPM_DIR: docs
  helm:
    taskfile: https://raw.githubusercontent.com/batleforc/weebo-operator-kit/v0.10.1/tasks/helm.yaml
    checksum: e3d0c9ef0c9d5ae970396a38214bba4dabd6cb2c141613db3844f360c08dab56
    vars:
      CHART: deploy/charts/weebo-authentik

# `testkit` (dev-dependency of `adapters-inbound`, pulled in by any cargo
# invocation that builds its tests, including `clippy --all-targets`) pulls
# in the `envtest` crate, which needs a Go toolchain (`mise use go`) and a
# real `libclang.so` on LIBCLANG_PATH — see crates/testkit/src/envtest.rs
# for why mise's own `clang` package isn't enough. Defaults below match
# that file's documented setup; override by exporting these yourself
# before running `task` if your setup differs.
env:
  # The exported value, else the Che workspace's libclang when present,
  # else the system's (Fedora; CI on Ubuntu exports its own).
  LIBCLANG_PATH:
    sh: |
      che=/home/user/.local/share/llvm-libclang/22.1.8/lib
      if [ -n "${LIBCLANG_PATH:-}" ]; then echo "$LIBCLANG_PATH"
      elif [ -d "$che" ]; then echo "$che"
      else echo /usr/lib64; fi
  BINDGEN_EXTRA_CLANG_ARGS:
    sh: |
      if [ -n "${BINDGEN_EXTRA_CLANG_ARGS+set}" ]; then echo "$BINDGEN_EXTRA_CLANG_ARGS"
      elif [ -d /usr/lib/gcc/x86_64-linux-gnu/15/include ]; then echo "-I/usr/lib/gcc/x86_64-linux-gnu/15/include -I/usr/include"
      else echo "-I/usr/lib/gcc/x86_64-redhat-linux/16/include -I/usr/include"; fi

tasks:
  init:
    desc: "Init folder"
    cmds:
      - mise upgrade
      - cog install-hook -a -o

  doctor:
    desc: "Check the local dev setup needed by envtest (Go, libclang, control-plane binaries), the chart tools and the git hooks"
    cmds:
      - mise install
      - task: rust:doctor
        vars: { DOCTOR_TOOLS: "helm hadolint" }

  recu:
    desc: "Recuring job like regenerating Swagger spec"
    cmds:
      - mise exec -- cargo run -p crdgen -- --out deploy/crd/
      # The chart ships the CRDs as templates (Helm never upgrades crds/),
      # wrapped in `crds.install` + `helm.sh/resource-policy: keep`.
      - task: helm:crds
      # CRD reference pages + form schemas of the docs site, and its operator
      # reference (reason codes and metrics read from crates/, the budget from
      # docs/perf/): weebo-crd-docs (@weebo/operator-docs) reads
      # docs/crd-docs.config.mjs and clears its own previous outputs. Needs
      # docs/node_modules (npm ci --prefix docs).
      - mise exec -- npm run gen:crds --prefix docs --silent

  lint:
    desc: "cargo fmt --check + clippy -D warnings, actionlint on CI, hadolint on the Dockerfile"
    cmds:
      - task: rust:lint
      - task: repo:lint

  audit:
    desc: "Check dependencies and the Dockerfile for CVE (cargo-deny + trivy on Cargo.lock, npm audit on the docs site, trivy config)"
    cmds:
      # advisories (RUSTSEC, yanked, unmaintained), licenses and sources —
      # see deny.toml — then trivy on Cargo.lock as a second opinion.
      - task: rust:audit
      # The docs site's shipped dependencies (dev tooling never reaches the
      # built site), and misconfigurations of the Dockerfile.
      - task: repo:audit

  lint:helm:
    desc: "helm lint + smoke renders of the operator chart (the kit's value combinations and refusals)"
    cmds:
      - task: helm:lint

  docs:
    desc: "Run the Fumadocs documentation site in dev mode"
    dir: docs
    cmds:
      - npm run dev
