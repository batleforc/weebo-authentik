name: Publish

# A pushed release tag `vX.Y.Z` (a bump made locally with `cog bump`, which
# synced Cargo.toml and Chart.yaml through .hooks/bump-versions.sh):
# weebo-operator-kit's publish workflow — the operator image of each
# variant (distroless Debian 13, and Red Hat Hummingbird as `-hardened`),
# scanned by Grype, smoke-run, signed; the chart (OCI); the GitHub Release.
# The hardened variant is optional: a finding without a fix there leaves it
# out of the release instead of blocking it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to (re)publish.
        required: true
        type: string

permissions: {}

jobs:
  publish:
    uses: batleforc/weebo-operator-kit/.github/workflows/publish.yml@v0.11.0
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      image: ghcr.io/batleforc/weebo-authentik-operator
      chart: weebo-authentik
      variants: >-
        [{"file": "Containerfile", "suffix": "", "required": true},
         {"file": "Containerfile.hardened", "suffix": "-hardened", "required": false}]
      smoke-entrypoint: /usr/local/bin/operator
      smoke-args: --version
