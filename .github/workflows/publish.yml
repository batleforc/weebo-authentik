name: Publish

# Triggered by the tag release.yml pushes — builds and publishes the
# operator image and the Helm chart for that already-version-synced
# commit (Cargo.toml/Chart.yaml were bumped together by
# .hooks/bump-versions.sh before the tag was created, see cog.toml's
# pre_bump_hooks).
on:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Only tag :latest if this is the highest version tag
        id: latest
        env:
          # Routed through env instead of interpolating ${{ github.ref_name }}
          # directly into the script below: a git tag name is not restricted
          # to safe characters (`$`, backticks, `;` etc. are all valid ref
          # names), so splicing it into `run:` as literal script text would
          # let a maliciously-named pushed tag execute arbitrary shell here.
          REF_NAME: ${{ github.ref_name }}
        run: |
          # A manual/backport push of an old v* tag (e.g. re-publishing
          # v1.2.4 after v2.0.0 already shipped) must not overwrite
          # :latest with an older image — compare this tag against every
          # strict-semver v* tag on the remote using semver-aware sort.
          # `git ls-remote` needs no local history, so this doesn't require
          # the full-history checkout `fetch-depth: 0` would (the tag glob
          # is also narrowed to `vX.Y.Z` so `sort -V` — which isn't full
          # semver-precedence aware for prerelease/build suffixes — only
          # ever compares tags of that exact shape).
          highest=$(git ls-remote --tags --refs origin 'refs/tags/v[0-9]*.[0-9]*.[0-9]*' \
            | sed 's#.*refs/tags/##' | sort -V | tail -n1)
          tags="ghcr.io/batleforc/weebo-authentik-operator:${REF_NAME}"
          if [ "$highest" = "$REF_NAME" ]; then
            tags="$(printf '%s\nghcr.io/batleforc/weebo-authentik-operator:latest' "$tags")"
          else
            echo "::notice::${REF_NAME} is not the highest version tag ($highest) — skipping the :latest tag"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.latest.outputs.tags }}

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: ./.github/actions/setup-mise

      - name: Install mise-managed tools (helm, ...)
        run: mise install

      - name: helm registry login ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | mise exec -- helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push the chart
        run: |
          mise exec -- helm package deploy/charts/weebo-authentik
          mise exec -- helm push weebo-authentik-*.tgz oci://ghcr.io/batleforc/charts
