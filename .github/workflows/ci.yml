name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # testkit -> envtest needs libclang.so for its rust2go/bindgen build
      # step (see crates/testkit/src/envtest.rs) — pulled in transitively
      # by `cargo clippy --all-targets`, so this job needs it too.
      - name: Install libclang (bindgen/rust2go)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          echo "LIBCLANG_PATH=$(dirname "$(dpkg -L libclang-dev | grep -m1 'libclang\.so')")" >> "$GITHUB_ENV"

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install mise-managed tools (rust, go, task, ...)
        run: mise install

      - name: Lint
        run: mise exec -- task lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install libclang (bindgen/rust2go)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          echo "LIBCLANG_PATH=$(dirname "$(dpkg -L libclang-dev | grep -m1 'libclang\.so')")" >> "$GITHUB_ENV"

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install mise-managed tools (rust, go, task, ...)
        run: mise install

      - name: Unit + contract tests
        run: mise exec -- task test

      - name: Real envtest-backed controller integration tests
        run: mise exec -- task test:integration

  regen-and-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install mise-managed tools (rust, ...)
        run: mise install

      - name: Regenerate CRDs from source
        run: mise exec -- cargo run -p crdgen -- --out deploy/crd/

      # Helm's crds/ directory is a plain copy, not a template (see
      # Taskfile.yaml's `recu` task) — checked here too so it can't
      # silently drift from deploy/crd/.
      - name: Sync CRDs into the Helm chart
        run: cp deploy/crd/*.yaml deploy/charts/weebo-authentik/crds/

      - name: Install docs/ dependencies
        run: mise exec -- npm ci --prefix docs

      # docs/content/docs/crds/*.mdx + docs/public/crd-schemas/*.json
      # are generated from deploy/crd/*.yaml, never hand-edited — see
      # .prompt/plan.md, "Definition of done".
      - name: Regenerate CRD docs
        run: mise exec -- node docs/scripts/gen-crd-docs.mjs

      - name: Fail if committed CRDs or docs are stale
        run: |
          git diff --exit-code \
            deploy/crd/ \
            deploy/charts/weebo-authentik/crds/ \
            docs/content/docs/crds/ \
            docs/public/crd-schemas/

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build-only, no push/registry credentials assumed — proves the
      # Dockerfile actually builds (never exercised locally, see
      # CLAUDE.md: no container engine in this repo's dev sandbox).
      # Publishing is a separate, deliberate step once a registry/tagging
      # policy is decided, not bundled into this check.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
