name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  # weebo-operator-kit's checks: task lint, test:all, audit, lint:helm —
  # with the runner's unused toolchains removed first (this envtest-backed
  # workspace has run out of disk without it).
  checks:
    uses: batleforc/weebo-operator-kit/.github/workflows/checks.yml@v0.13.0
    permissions:
      contents: read
    with:
      test-task: "test:all"
      helm-task: "lint:helm"

  regen-and-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: ./.github/actions/setup-mise

      - name: Install mise-managed tools (rust, node, helm, ...)
        run: mise install

      - name: Install docs/ dependencies
        run: mise exec -- npm ci --prefix docs

      # The CRDs (crdgen), their chart templates (the kit's helm:crds), and
      # docs/content/docs/crds/*.mdx + docs/public/crd-schemas/*.json +
      # docs/content/docs/reference/ (generated from deploy/crd/, crates/
      # and docs/perf/) — never hand-edited, see .prompt/plan.md,
      # "Definition of done".
      - name: Regenerate CRDs, chart CRDs and docs
        run: mise exec -- task recu --force

      - name: Fail if committed CRDs or docs are stale
        run: |
          git diff --exit-code \
            deploy/crd/ \
            deploy/charts/weebo-authentik/templates/crds/ \
            docs/content/docs/crds/ \
            docs/public/crd-schemas/ \
            docs/content/docs/reference/

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        file: [Containerfile, Containerfile.static]
    steps:
      - uses: actions/checkout@v4

      # Build-only, no push/registry credentials assumed — proves each
      # Containerfile actually builds. Publishing is the release's
      # (publish.yml, the kit's workflow).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false

  docs-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Build the way Pages publishes it, so a basePath-sensitive break (a
      # missing asset prefix, a client fetch that ignores it) fails the PR
      # rather than the deploy. No cargo/libclang needed — this is just Next.
      NEXT_PUBLIC_BASE_PATH: /weebo-authentik
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: ./.github/actions/setup-mise

      - name: Install Node (mise)
        run: mise install node

      - name: Install docs dependencies
        run: mise exec -- npm ci --prefix docs

      - name: Build static export
        run: mise exec -- npm run build --prefix docs
